name: mhrd
description: MHRD (MacroHard Remote Desktop) — легкий кросплатформний RDP-клієнт.
publish_to: none
version: 0.3.0+6

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Переклади інтерфейсу: lib/l10n/*.arb → AppLocalizations (flutter gen-l10n)
  flutter_localizations:
    sdk: flutter
  intl: any
  # Локальна база (SQLite через FFI, без кодогенерації). З 3.x сам вбудовує бібліотеку SQLite
  # через build hooks, тому sqlite3_flutter_libs більше не потрібен.
  sqlite3: ^3.8.0
  # Системне сховище секретів: Credential Manager / Keychain / libsecret / Keystore
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  # Argon2id, PBKDF2, AES-GCM на чистому Dart
  cryptography: ^2.7.0
  # Діалоги відкриття/збереження файлів
  file_selector: ^1.0.3
  # Рядки для dart:ffi (спільна пам'ять сеансу, lib/sessions/frame_buffer.dart)
  ffi: ^2.1.0
  # Повний екран сеансу (Windows/Linux/macOS)
  window_manager: ^0.5.2
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # Тексти ліцензій OFL: показуються в «Ліцензіях» застосунку (реєстрація в main.dart).
  assets:
    - assets/fonts/licenses/
  # Статичні TTF (400/500/600) з Google Fonts, усі з кирилицею. Назви сімейств = MhrdTokens.
  # Змінні (variable) шрифти не беремо: Flutter не застосовує до них fontWeight сам.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
    - family: Exo 2
      fonts:
        - asset: assets/fonts/Exo2-Regular.ttf
        - asset: assets/fonts/Exo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Exo2-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
