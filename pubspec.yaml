name: mhrd
description: MHRD (MacroHard Remote Desktop) — легкий кросплатформний RDP-клієнт.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Локальна база (SQLite через FFI, без кодогенерації)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  # Системне сховище секретів: Credential Manager / Keychain / libsecret / Keystore
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  # Argon2id, PBKDF2, AES-GCM на чистому Dart
  cryptography: ^2.7.0
  # Діалоги відкриття/збереження файлів
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Шрифти IBM Plex (OFL) додаються на етапі 1, див. CLAUDE.md → «Відкриті задачі».
  # Поки файлів немає, НЕ оголошуйте їх тут, інакше збірка впаде.
