name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Тунелі: справжній WireGuard на loopback (native/tunnels/tunnel_test.go)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/tunnels/go.mod
          cache-dependency-path: native/tunnels/go.sum
      - run: go vet ./... && go test ./...
        working-directory: native/tunnels

  # Повна збірка під 4 ОС — лише вручну (Actions → build → Run workflow): у приватному
  # репозиторії хвилини Windows рахуються ×2, macOS — ×10, і кожен push з'їдав би сотні хвилин.
  build:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - os: ubuntu-latest
            platform: linux
            build: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - os: macos-latest
            platform: macos
            build: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - os: ubuntu-latest
            platform: android
            build: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      # Якщо платформної теки ще немає в репозиторії, створюємо її (lib/ і test/ не перезаписуються).
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then
            flutter create --project-name mhrd --org ua.mhrd --platforms=${{ matrix.platform }} .
          fi
      # Модуль сеансу mhrd-session (FreeRDP через vcpkg). Кеш бінарних пакетів vcpkg —
      # щоб FreeRDP і OpenSSL (~30 хв) збирались лише при зміні native/session/vcpkg.json.
      - if: matrix.platform == 'windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          # + оверлей FreeRDP: його зміна теж міняє збірку (інакше старий кеш і щоразу 30 хв збирання)
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/session/vcpkg.json', 'native/session/vcpkg-overlay/**') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - if: matrix.platform == 'windows'
        name: Build mhrd-session
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
          # Повний клон: builtin-baseline з vcpkg.json має бути в його історії.
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          # = builtin-baseline з vcpkg.json: і порти, і сам інструмент vcpkg — точно ці, не «останні».
          git -C "$env:RUNNER_TEMP\vcpkg" checkout --quiet d186940b2f0c4e8e5b4ff804af57d2a26fbfa091
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          ./native/session/build.ps1 -Config Release
      # Модуль тунелів mhrd-tunnel (Go: WireGuard netstack)
      - if: matrix.platform == 'windows'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/tunnels/go.mod
          cache-dependency-path: native/tunnels/go.sum
      - if: matrix.platform == 'windows'
        name: Build mhrd-tunnel
        shell: pwsh
        run: ./native/tunnels/build.ps1
      - run: flutter pub get
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mhrd-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
