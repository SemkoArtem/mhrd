name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - os: ubuntu-latest
            platform: linux
            build: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - os: macos-latest
            platform: macos
            build: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - os: ubuntu-latest
            platform: android
            build: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      # Якщо платформної теки ще немає в репозиторії, створюємо її (lib/ і test/ не перезаписуються).
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then
            flutter create --project-name mhrd --org ua.mhrd --platforms=${{ matrix.platform }} .
          fi
      - run: flutter pub get
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: mhrd-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
