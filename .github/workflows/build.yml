name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Повна збірка під 4 ОС — лише вручну (Actions → build → Run workflow): у приватному
  # репозиторії хвилини Windows рахуються ×2, macOS — ×10, і кожен push з'їдав би сотні хвилин.
  build:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - os: ubuntu-latest
            platform: linux
            build: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - os: macos-latest
            platform: macos
            build: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - os: ubuntu-latest
            platform: android
            build: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      # Якщо платформної теки ще немає в репозиторії, створюємо її (lib/ і test/ не перезаписуються).
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then
            flutter create --project-name mhrd --org ua.mhrd --platforms=${{ matrix.platform }} .
          fi
      # Модуль сеансу mhrd-session (FreeRDP через vcpkg). Кеш бінарних пакетів vcpkg —
      # щоб FreeRDP і OpenSSL (~30 хв) збирались лише при зміні native/session/vcpkg.json.
      - if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/session/vcpkg.json') }}
      - if: matrix.platform == 'windows'
        name: Build mhrd-session
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
          # Повний клон: builtin-baseline з vcpkg.json має бути в його історії.
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          ./native/session/build.ps1 -Config Release
      - run: flutter pub get
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: mhrd-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
