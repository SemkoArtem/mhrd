name: linux

# Linux-версія (поки попередня): push у гілку linux → збирання на Ubuntu 22.04 (glibc 2.35 — тож
# працює на Debian 12+, Ubuntu 22.04+/Mint 21+, Arch) → AppImage і tar.gz у ЧЕРНЕТКУ релізу
# «linux-preview». Чернетку бачать лише власник і ті, кому дано доступ до репозиторію.
on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: write  # чернетка релізу з файлами

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config patchelf \
            autoconf autoconf-archive automake libtool bison flex gperf libltdl-dev python3-venv python3-jinja2 \
            libgtk-3-dev liblzma-dev libsecret-1-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev

      # mhrd-session: FreeRDP, OpenSSL, SDL3 через vcpkg (статично). Кеш — щоб довге збирання
      # повторювалось лише при зміні залежностей.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-ubuntu2204-${{ hashFiles('native/session/vcpkg.json', 'native/session/vcpkg-overlay/**') }}
          restore-keys: vcpkg-ubuntu2204-
      - name: Build mhrd-session
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          # = builtin-baseline з vcpkg.json
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet d186940b2f0c4e8e5b4ff804af57d2a26fbfa091
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg" bash native/session/build.sh Release

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/tunnels/go.mod
          cache-dependency-path: native/tunnels/go.sum
      - name: Build mhrd-tunnel
        run: bash native/tunnels/build.sh

      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release

      - name: Version
        id: ver
        run: |
          v=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$v-linux.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: AppImage and tar.gz
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          bash linux/packaging/package.sh "${{ steps.ver.outputs.version }}" "$RUNNER_TEMP/appimagetool"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mhrd-linux-${{ steps.ver.outputs.version }}
          path: build/dist/*

      # Одна чернетка «linux-preview»: стару прибираємо, кладемо свіжу.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete linux-preview --yes 2>/dev/null || true
          gh release create linux-preview build/dist/* --draft --prerelease --target "$GITHUB_SHA" \
            --title "MHRD для Linux — попередня збірка ${{ steps.ver.outputs.version }}" \
            --notes "Попередня збірка для перевірки. AppImage: chmod +x і запустити. tar.gz: розпакувати й запустити ./mhrd (портативна)."
